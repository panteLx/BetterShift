version: 2
updates:
  # npm dependencies (root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 1.7 removes genericOAuthClient and changes the OIDC callback URL from
      # /api/auth/oauth2/callback/:id to /api/auth/callback/:id, which would
      # silently break every self-hoster's identity-provider configuration.
      # That upgrade needs a deliberate migration with release notes, not an
      # automatic PR.
      - dependency-name: "better-auth"
        versions:
          - ">= 1.7.0"
      # 13.0 rewrote the driver onto N-API and dropped the prebuild-install
      # release assets. The npm package now ships prebuilds/, but it also ships
      # binding.gyp without an install script, so npm falls back to
      # `node-gyp rebuild` and compiles from source — which fails in the slim
      # Alpine image, and would mean a from-scratch rewrite of the only
      # datastore either way. Revisit once upstream stops triggering node-gyp.
      - dependency-name: "better-sqlite3"
        versions:
          - ">= 13.0.0"
      # 10 removes the deprecated rule-context methods, which eslint-plugin-react
      # still calls (`contextOrFilename.getFilename is not a function`). Its
      # newest release, 7.37.5, caps its peer range at eslint ^9.7, and
      # eslint-config-next pins ^7.37.0 even on canary — so there is no override
      # that fixes this. eslint-config-next's own peer range of ">=9.0.0" is what
      # lets npm install 10 in the first place. Revisit once that chain supports 10.
      - dependency-name: "eslint"
        versions:
          - ">= 10.0.0"
      # 7 is the native port and no longer exposes the compiler API: `next build`
      # aborts with "TypeScript 7.0.2 does not provide the compiler API required
      # by Next.js", and typescript-eslint refuses to load at all. 6.x is what
      # Next.js points at instead and stays reachable through this rule.
      - dependency-name: "typescript"
        versions:
          - ">= 7.0.0"

  # GitHub Actions workflows (root)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker base image (picks up node:24-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
