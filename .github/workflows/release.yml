name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress release build: a half-cancelled run could
  # publish a broken or partial image and/or GitHub release.
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build Test (includes TypeScript check)
        run: npm run build

      - name: i18n Check
        run: npm run i18n

      - name: Migrations apply cleanly and match the committed schema
        run: |
          # Apply the committed migrations first (mirrors what the Docker image's
          # CMD does in production), then assert that generating from the schema
          # produces no further changes — if it does, a migration was edited
          # without committing the generated SQL under drizzle/.
          npm run db:migrate
          npm run db:generate
          git diff --exit-code drizzle/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, showing all commits"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Generating changelog from $PREVIOUS_TAG to $GITHUB_REF_NAME"

          CHANGELOG=$(scripts/changelog.sh "$PREVIOUS_TAG" "$GITHUB_REF_NAME")

          # Use heredoc for multiline output
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> $GITHUB_OUTPUT

          # Set previous tag
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest

      - name: Capture build timestamp
        id: timestamp
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=v${{ steps.version.outputs.VERSION }}
            BUILD_DATE=${{ steps.timestamp.outputs.BUILD_DATE }}
            COMMIT_SHA=${{ github.sha }}
            COMMIT_REF=${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## 📦 What's Changed

            ${{ steps.changelog.outputs.changelog }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.previous_tag }}...v${{ steps.version.outputs.VERSION }}

            ## 🐳 Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.VERSION }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            ### Available tags:
            - `v${{ steps.version.outputs.VERSION }}` - Specific version
            - `latest` - Latest stable release
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
